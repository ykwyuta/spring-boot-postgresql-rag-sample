spring:
  application:
    name: transport-rag
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/transport_rag}
    username: ${DB_USERNAME:rag}
    password: ${DB_PASSWORD}
    hikari:
      connection-init-sql: "LOAD 'age'; SET search_path = ag_catalog, public;"
  ai:
    mcp:
      server:
        name: transport-rag
        version: 0.0.1
        type: SYNC
        protocol: STATELESS
        streamable-http:
          mcp-endpoint: /mcp
          disallow-delete: true
server:
  port: ${SERVER_PORT:8080}
mybatis:
  mapper-locations: classpath*:mappers/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 10
